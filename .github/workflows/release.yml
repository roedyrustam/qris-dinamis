name: Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test

  npm-publish:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @qris-dinamis/core build && pnpm --filter @qris-dinamis/cli build
      - name: Publish @qris-dinamis/core if version not yet on npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          CORE_VER=$(node -p "require('./packages/core/package.json').version")
          if npm view "@qris-dinamis/core@${CORE_VER}" version >/dev/null 2>&1; then
            echo "@qris-dinamis/core@${CORE_VER} is already published on npm, skipping."
          else
            pnpm --filter @qris-dinamis/core publish --access public --no-git-checks --provenance
          fi
      - name: Publish @qris-dinamis/cli if version not yet on npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          CLI_VER=$(node -p "require('./packages/cli/package.json').version")
          if npm view "@qris-dinamis/cli@${CLI_VER}" version >/dev/null 2>&1; then
            echo "@qris-dinamis/cli@${CLI_VER} is already published on npm, skipping."
          else
            pnpm --filter @qris-dinamis/cli publish --access public --no-git-checks --provenance
          fi

  docker:
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: qris-dinamis-api
            dockerfile: Dockerfile
          - name: qris-dinamis-web
            dockerfile: apps/web/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
